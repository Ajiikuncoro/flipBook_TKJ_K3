<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETBOOK - Media dan Jaringan Telekomunikasi</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app">

        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">N</div>
                <div>
                    <strong>NET<span>BOOK</span></strong>
                    <small>INTERACTIVE LEARNING MEDIA</small>
                </div>
            </div>

            <div class="header-info">
                <span class="status-dot"></span>
                MEDIA PEMBELAJARAN DIGITAL
            </div>

            <button class="icon-button" id="fullscreenBtn"
                    type="button" title="Layar penuh">⛶</button>
        </header>

        <main class="main-content">
            <section class="intro">
                <div class="eyebrow">DIGITAL LEARNING EXPERIENCE</div>
                <h1>MEDIA DAN <span>JARINGAN</span> TELEKOMUNIKASI</h1>
                <p>Pelajari berbagai media transmisi dalam jaringan komputer.</p>
            </section>

            <section class="book-area">
                <div class="book-scene">
                    <div class="book" id="book">

                        <div class="book-page left-page">
                            <div class="page-inner" id="leftContent"></div>
                        </div>

                        <div class="book-page right-page">
                            <div class="page-inner" id="rightContent"></div>
                        </div>

                        <div class="flip-sheet" id="flipSheet">
                            <div class="flip-face flip-front" id="flipFront"></div>
                            <div class="flip-face flip-back" id="flipBack"></div>
                        </div>

                    </div>
                </div>

                <div class="navigation">
                    <button class="nav-button" id="prevBtn" type="button">
                        <span>‹</span>
                        <small>SEBELUMNYA</small>
                    </button>

                    <div class="page-indicator">
                        <div class="page-count">
                            <strong id="currentPage">01</strong>
                            <span>/</span>
                            <span id="totalPage">22</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <small id="pageLabel">SAMPUL</small>
                    </div>

                    <button class="nav-button next-button" id="nextBtn"
                            type="button">
                        <small>BERIKUTNYA</small>
                        <span>›</span>
                    </button>
                </div>

                <div class="bottom-tools">
                    <button class="tool-button" id="coverBtn" type="button">
                        ↶ Kembali ke Sampul
                    </button>

                    <div class="keyboard-hint">
                        Gunakan tombol <kbd>←</kbd> dan <kbd>→</kbd>
                        untuk berpindah halaman
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <span>NETBOOK • MEDIA PEMBELAJARAN</span>
            <span>KELOMPOK 3 • 2026</span>
        </footer>

    </div>
</body>
</html>
